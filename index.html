<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarim Sadman Rafio | German Learning Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; overflow-y: scroll; }
        .tab-active { border-bottom: 2px solid #0ea5e9; color: #0284c7; font-weight: 600; }
        .tab-inactive { color: #64748b; font-weight: 500; }
        .tab-inactive:hover { color: #0ea5e9; }
        .hide { display: none; }
        .card-hover { transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-brand-900 flex items-center">
                        <span class="material-icons mr-2 text-brand-500">language</span>
                        German Learning Hub
                    </h1>
                    <p class="text-sm text-slate-500 mt-1">Curated A1 & A2 Curriculum Resources</p>
                </div>
                <div class="text-sm font-medium text-slate-400 bg-slate-100 px-3 py-1 rounded-full">
                    46 Total Lessons
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Navigation Tabs -->
        <div class="flex space-x-6 border-b border-slate-200 mb-8">
            <button onclick="switchTab('a1')" id="tab-a1" class="pb-3 px-2 tab-active text-lg flex items-center">
                A1 Course <span class="ml-2 bg-brand-100 text-brand-600 text-xs py-0.5 px-2 rounded-full">20</span>
            </button>
            <button onclick="switchTab('a2')" id="tab-a2" class="pb-3 px-2 tab-inactive text-lg flex items-center">
                A2 Course <span class="ml-2 bg-slate-100 text-slate-500 text-xs py-0.5 px-2 rounded-full" id="badge-a2">26</span>
            </button>
        </div>

        <!-- A1 Grid -->
        <div id="grid-a1" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Populated by JS -->
        </div>

        <!-- A2 Grid -->
        <div id="grid-a2" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hide">
            <!-- Populated by JS -->
        </div>

    </main>

    <script>
        // --- 1. A1 DATA (20 Items) ---
        // Fill in your specific links inside the quotation marks for each lesson.
        const a1Lessons = [
            { title: "Lesson 1", desc: "Introductions & Greetings", video: "YOUR_DRIVE_LINK_HERE", pdf: "YOUR_PDF_LINK_HERE" },
            { title: "Lesson 2", desc: "Alphabets & Numbers", video: "YOUR_DRIVE_LINK_HERE", pdf: "YOUR_PDF_LINK_HERE" },
            { title: "Lesson 3", desc: "Basic Grammar", video: "YOUR_DRIVE_LINK_HERE", pdf: "YOUR_PDF_LINK_HERE" },
            // To quickly add the rest of the 20, just copy and paste the line above and change the links.
            // ... add lessons 4 through 20 here.
        ];

        // --- 2. A2 DATA (26 Items) ---
        const a2Lessons = [
            { title: "Lesson 1", desc: "Advanced Grammar", video: "YOUR_DRIVE_LINK_HERE", pdf: "YOUR_PDF_LINK_HERE" },
            { title: "Lesson 2", desc: "Complex Sentences", video: "YOUR_DRIVE_LINK_HERE", pdf: "YOUR_PDF_LINK_HERE" },
            // ... add lessons 3 through 26 here.
        ];

        // --- 3. HTML GENERATOR ---
        // This function builds a card for every item in your arrays
        function renderCards(dataArray, containerId, levelLabel) {
            const container = document.getElementById(containerId);
            let html = '';
            
            dataArray.forEach((lesson, index) => {
                let lessonNumber = index + 1;
                html += `
                <div class="bg-white border border-slate-200 rounded-xl p-5 card-hover flex flex-col justify-between h-full">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="bg-brand-50 text-brand-600 text-xs font-bold px-2 py-1 rounded uppercase tracking-wide">
                                ${levelLabel} • Lektion ${lessonNumber}
                            </span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-1">${lesson.title}</h3>
                        <p class="text-sm text-slate-500 mb-5">${lesson.desc}</p>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 mt-auto pt-4 border-t border-slate-100">
                        <a href="${lesson.video}" target="_blank" class="flex justify-center items-center py-2 bg-brand-600 hover:bg-brand-500 text-white rounded-lg text-sm font-medium transition">
                            <span class="material-icons text-[18px] mr-1">play_circle</span> Video
                        </a>
                        <a href="${lesson.pdf}" target="_blank" class="flex justify-center items-center py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 rounded-lg text-sm font-medium transition">
                            <span class="material-icons text-[18px] mr-1">picture_as_pdf</span> PDF
                        </a>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
        }

        // --- 4. INITIALIZATION & TAB SWITCHING ---
        // Render the grids on page load
        renderCards(a1Lessons, 'grid-a1', 'A1');
        renderCards(a2Lessons, 'grid-a2', 'A2');

        function switchTab(level) {
            // Handle Tabs
            document.getElementById('tab-a1').className = "pb-3 px-2 tab-inactive text-lg flex items-center";
            document.getElementById('tab-a2').className = "pb-3 px-2 tab-inactive text-lg flex items-center";
            document.getElementById('badge-a2').className = "ml-2 bg-slate-100 text-slate-500 text-xs py-0.5 px-2 rounded-full";
            
            if (level === 'a1') {
                document.getElementById('tab-a1').className = "pb-3 px-2 tab-active text-lg flex items-center";
            } else {
                document.getElementById('tab-a2').className = "pb-3 px-2 tab-active text-lg flex items-center";
                document.getElementById('badge-a2').className = "ml-2 bg-brand-100 text-brand-600 text-xs py-0.5 px-2 rounded-full";
            }

            // Handle Grids
            document.getElementById('grid-a1').classList.add('hide');
            document.getElementById('grid-a2').classList.add('hide');
            document.getElementById('grid-' + level).classList.remove('hide');
        }
    </script>
</body>
</html>
